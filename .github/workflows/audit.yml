name: Sync security audit to audit branch

on:
  push:
    branches: [main]
    paths:
      - docs/security-audit.md
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with sparse config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/security-audit.md
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Push docs/security-audit.md to audit branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan audit-tmp
          git reset --hard

          git checkout "$GITHUB_SHA" -- docs/security-audit.md

          git add docs/security-audit.md
          git commit -m "chore: sync security-audit.md from ${GITHUB_SHA::7}"

          git push origin HEAD:refs/heads/audit --force
